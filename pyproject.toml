[project]
name = "xblick-sam3"
version = "0.2.4"
description = "Meta's SAM 3.1 (open-vocabulary instance segmentation) as a Durchblick vision node"
readme = "README.md"
license = "Apache-2.0 AND LicenseRef-SAM-License"
license-files = ["LICENSE", "NOTICE", "LICENSES/SAM-License.txt"]
authors = [{ name = "David Schneider" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "xblick>=0.5.5,<0.6",  # the Durchblick core: node, history, tensors, mps, parameters, vision_msgs
    # SAM 3 / 3.1's model code (facebookresearch/sam3, SAM License); uv.lock fixes the commit
    "sam3",
    "torch>=2.7",
    "numpy>=1.26,<2",
    # sam3.model_builder finds its tokenizer's vocabulary with pkg_resources (gone from setuptools 81)
    "setuptools<81",
    # sam3's imports beyond its declared requirements
    "einops>=0.8",
    "pycocotools>=2.0",
    "psutil>=5.9",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
]

[project.scripts]
xblick-sam3 = "xblick_sam3.node:main"
xblick-sam3-prompts = "xblick_sam3.prompts:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
"sam3" = { git = "https://github.com/facebookresearch/sam3.git", branch = "main" }
"torch" = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
